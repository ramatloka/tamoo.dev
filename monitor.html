<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Display - TAMOO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --gold-main: #b39343; 
            --gold-dark: #846924; 
            --gold-bg: #967728;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fbfbfa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            color: #333;
        }

        /* Top Border Emas Tipis */
        .top-bar { height: 10px; background: var(--gold-main); width: 100%; }
        
        /* Area Konten Utama */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            padding: 20px 40px 10px 40px;
        }
        
        /* Nama Event */
        #displayEventName {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--gold-dark);
            letter-spacing: 2px;
            margin-top: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Wadah Status & Greeting */
        .status-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        
        #displayStatusMessage {
            font-size: 1.8rem;
            color: #888;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse 2.2s infinite;
        }

        /* Greeting Tamu Blend In */
        .welcome-blend {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeInScale 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .greeting-title {
            font-size: 2.2rem;
            color: var(--gold-main);
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .guest-name {
            font-size: 5rem;
            font-weight: 900;
            color: #111;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .custom-fields-box {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }
        .field-badge {
            background: rgba(230, 230, 225, 0.6);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #444;
            border: 1px solid #dcdcd0;
        }

        /* BARIS BRANDING RAMATLOKA (Di atas Ticker & Berwarna Emas) */
        .brand-header {
            width: 100%;
            text-align: right;
            padding: 10px 40px;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--gold-dark);
            text-transform: uppercase;
        }

        /* SATU-SATUNYA TICKER BERJALAN BERWARNA EMAS */
        .ticker-wrap {
            width: 100%;
            background: var(--gold-bg);
            color: #ffffff;
            padding: 14px 0;
            overflow: hidden;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: tickerGo 22s linear infinite;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Keyframe Animations */
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes tickerGo { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <div class="content-area">
        <div id="displayEventName">MEMUAT NAMA ACARA...</div>

        <div class="status-wrapper" id="displayCoreWrapper">
            <div id="displayStatusMessage">- MENUNGGU SCANNER -</div>
        </div>
    </div>

    <div class="brand-header">
        RAMATLOKA
    </div>

    <div class="ticker-wrap">
        <div class="ticker-move" id="displayTickerText">Selamat Datang di Acara Kami • Mohon Siapkan QR Code E-Ticket Anda Untuk Scan Masuk</div>
    </div>

    <script>
        const monitorChannel = new BroadcastChannel('tamoo_tv_broadcast');

        const savedEventName = localStorage.getItem('currentEventName') || 'DRAMA TARI - RAMA SHINTA';
        const savedTicker = localStorage.getItem('currentEventTicker') || 'Selamat Datang - MOHON SIAPKAN QR CODE ANDA';
        
        document.getElementById('displayEventName').innerText = savedEventName;
        document.getElementById('displayTickerText').innerText = savedTicker;

        monitorChannel.onmessage = (event) => {
            const { type, data, config } = event.data;
            
            if (type === 'INIT_DISPLAY') {
                document.getElementById('displayEventName').innerText = data.eventName;
                document.getElementById('displayTickerText').innerText = data.tickerText;
            } 
            else if (type === 'GUEST_CHECKIN') {
                renderGuestGreeting(data, config);
            }
        };

        let greetingTimeout;
        function renderGuestGreeting(guest, config) {
            clearTimeout(greetingTimeout);
            const container = document.getElementById('displayCoreWrapper');
            
            let badgesHtml = '';
            
            if (guest.jumlah_aktual && guest.jumlah_aktual > 1) {
                badgesHtml += `<div class="field-badge"><i class="fas fa-users"></i> ${guest.jumlah_aktual} Pax</div>`;
            }
            if (config.showKategori && guest.kategori_tamu) {
                badgesHtml += `<div class="field-badge"><i class="fas fa-crown" style="color:#b39343"></i> ${guest.kategori_tamu.toUpperCase()}</div>`;
            }
            if (config.showInstitusi && guest.institusi && guest.institusi !== 'Umum') {
                badgesHtml += `<div class="field-badge"><i class="fas fa-building"></i> ${guest.institusi}</div>`;
            }

            container.innerHTML = `
                <div class="welcome-blend">
                    <div class="greeting-title">SELAMAT DATANG</div>
                    <div class="guest-name">${guest.nama_tamu}</div>
                    ${badgesHtml ? `<div class="custom-fields-box">${badgesHtml}</div>` : ''}
                </div>
            `;

            greetingTimeout = setTimeout(() => {
                container.innerHTML = `<div id="displayStatusMessage">- MENUNGGU SCANNER -</div>`;
            }, 7000);
        }
    </script>
</body>
</html>
